<script>
(function () {
  "use strict";

  // ROT13：把输入转成密文再比对，源码里不出现明文账号
  function rot13(s) {
    return s.replace(/[a-zA-Z]/g, function (c) {
      var base = c <= "Z" ? 65 : 97;
      return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
    });
  }

  var USER_CIPHER = "thrfg"; // guest
  var PASS_CIPHER = "thrfg"; // guest

  var form = document.getElementById("loginForm");
  var msg = document.getElementById("msg");
  var hint = document.getElementById("hint");

  var T = {
    "zh-CN": {
      empty: "请输入用户名和密码。",
      fail: "权限不足。",
      ok: "验证通过，正在进入…",
      tip: "工单 XG-2019-0314 · 测试账号：guest / guest"
    },
    "zh-TW": {
      empty: "請輸入使用者名稱和密碼。",
      fail: "權限不足。",
      ok: "驗證通過，正在進入…",
      tip: "工單 XG-2019-0314 · 測試帳號：guest / guest"
    },
    "en": {
      empty: "Please enter username and password.",
      fail: "Access denied.",
      ok: "Verified. Redirecting…",
      tip: "Ticket XG-2019-0314 · Test account: guest / guest"
    }
  };
  function t() {
    var l = localStorage.getItem("metro.lang") || "zh-CN";
    return T[l] || T["zh-CN"];
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("user").value.trim();
    var p = document.getElementById("pass").value;

    msg.className = "msg";
    if (!u || !p) {
      msg.textContent = t().empty;
      msg.classList.add("err");
      return;
    }

    if (rot13(u) === USER_CIPHER && rot13(p) === PASS_CIPHER) {
      msg.textContent = t().ok;
      msg.classList.add("ok");
      setTimeout(function () { location.href = "directory.html"; }, 700);
    } else {
      msg.textContent = t().fail;
      msg.classList.add("err");
      document.getElementById("pass").value = "";
    }
  });

  document.getElementById("forgot").addEventListener("click", function (e) {
    e.preventDefault();
    hint.textContent = t().tip;
  });

  console.log("%c新港地铁 · 内部系统", "font-size:15px;color:#0057b8;font-weight:bold");
  console.log("登录节点：NIGHT-DISPATCH-13");
  console.log("上次登录：2019-03-14 00:13");
  console.log("上次登录用户：zhou.mo");
})();
</script>
